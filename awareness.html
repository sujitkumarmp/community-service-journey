
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awareness & Education | A Journey of Community Service</title>
  <style>
    :root {
      --navy: #14263d;
      --gold: #b98b4a;
      --cream: #faf8f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--navy);
      font-family: Arial, sans-serif;
    }
    header {
      background: var(--navy);
      color: white;
      padding: 50px 20px;
      text-align: center;
    }
    h1, h2 { font-family: Georgia, serif; }
    h1 { font-size: clamp(28px, 4vw, 42px); }
    header p { color: #e3c08c; }
    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .back {
      color: #926629;
      text-decoration: none;
    }
    .event {
      background: white;
      border: 1px solid #e8dfd3;
      border-radius: 12px;
      padding: 28px;
      margin: 22px 0;
      box-shadow: 0 8px 24px #14263d0a;
    }
    .date {
      color: #926629;
      font-size: 13px;
    }
    .event h2 { margin-bottom: 10px; }
    .event p { line-height: 1.7; }
    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .photos img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }
    footer {
      text-align: center;
      background: var(--navy);
      color: white;
      padding: 22px;
      margin-top: 60px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Awareness & Education</h1>
    <p>Knowledge Empowers. Early Detection Saves Lives.</p>
  </header>

  <main>
    <a class="back" href="index.html">← Back to Home</a>
    <div id="events" aria-live="polite">
      <p>Loading events...</p>
    </div>
  </main>

  <footer>A Journey of Community Service</footer>

  <script>
    async function loadEvents() {
      const container = document.getElementById("events");

      try {
        const response = await fetch("data/awareness.json");
        if (!response.ok) throw new Error("Unable to load events");

        const events = await response.json();
        events.sort((a, b) => b.date.localeCompare(a.date));

        container.replaceChildren();

        for (const event of events) {
          const article = document.createElement("article");
          article.className = "event";

          const date = document.createElement("div");
          date.className = "date";
          date.textContent = new Date(
            event.date + "T12:00:00"
          ).toLocaleDateString("en-GB", {
            day: "numeric",
            month: "long",
            year: "numeric"
          });

          const title = document.createElement("h2");
          title.textContent = event.title;

          const description = document.createElement("p");
          description.textContent = event.description;

          article.append(date, title, description);

          if (event.organizer) {
            const organizer = document.createElement("p");
            organizer.textContent = "Organised by: " + event.organizer;
            article.append(organizer);
          }

          if (event.photos && event.photos.length) {
            const gallery = document.createElement("div");
            gallery.className = "photos";

            for (const photo of event.photos) {
              const link = document.createElement("a");
              link.href = photo;
              link.target = "_blank";
              link.rel = "noopener noreferrer";

              const image = document.createElement("img");
              image.src = photo;
              image.alt = event.title;
              image.loading = "lazy";

              link.append(image);
              gallery.append(link);
            }

            article.append(gallery);
          }

          container.append(article);
        }
      } catch (error) {
        container.textContent =
          "The collection could not be loaded. Please try again.";
      }
    }

    loadEvents();
  </script>
</body>
</html>
